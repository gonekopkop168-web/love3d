<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ពាក្យផ្អែមល្ហែមជូននី ❤️ (3D)</title>
<link rel="preload" href="fonts/battambang-khmer-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="heading" id="heading">
  <h1>សារផ្អែមល្ហែមជូននី ❤️</h1>
  <p class="sub">គ្រប់ប្រអប់តូចៗ សុទ្ធតែមានពាក្យស្រឡាញ់ផ្ញើជូនអូននី 💗</p>
</div>
<canvas id="c"></canvas>
<div class="controls" id="controls">
  <button id="btnGravity" type="button">គ្មានទំនាញ</button>
  <button id="btnExplode" type="button">បាចសារស្នេហ៍</button>
</div>
<button id="bgmBtn" type="button" aria-label="តន្ត្រី" style="position:fixed;left:clamp(16px,3vw,40px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:6;width:46px;height:46px;padding:0;border-radius:50%;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center">🔊</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script src="script.js"></script>

</html>
